name: campus_go
description: "UNIMY Campus indoor navigation app."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0
  flutter_svg: ^2.3.0
  provider: ^6.1.5+1
  intl: ^0.20.3
  uuid: ^4.6.0
  webview_flutter: ^4.13.1
  webview_windows: ^0.2.0           # For Windows desktop support
  image_picker: ^1.2.3
  webview_flutter_web: ^0.2.3+4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/features/auth/login_background.png
    - assets/branding/logos/campusgo_location_pin.png
    - assets/features/navigation/icons/
    - assets/features/profile/icons/
    - assets/features/settings/icons/
    - assets/shared/icons/
    - assets/shared/icons/drawer/
    - assets/shared/illustrations/rooms/

  fonts:
    # ------------------------------------------------------------
    # Raleway
    # ------------------------------------------------------------
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway/static/Raleway-Thin.ttf
          weight: 100
        - asset: assets/fonts/Raleway/static/Raleway-ThinItalic.ttf
          weight: 100
          style: italic

        - asset: assets/fonts/Raleway/static/Raleway-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Raleway/static/Raleway-ExtraLightItalic.ttf
          weight: 200
          style: italic

        - asset: assets/fonts/Raleway/static/Raleway-Light.ttf
          weight: 300
        - asset: assets/fonts/Raleway/static/Raleway-LightItalic.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/Raleway/static/Raleway-Regular.ttf
          weight: 400
        - asset: assets/fonts/Raleway/static/Raleway-Italic.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/Raleway/static/Raleway-Medium.ttf
          weight: 500
        - asset: assets/fonts/Raleway/static/Raleway-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/Raleway/static/Raleway-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Raleway/static/Raleway-SemiBoldItalic.ttf
          weight: 600
          style: italic

        - asset: assets/fonts/Raleway/static/Raleway-Bold.ttf
          weight: 700
        - asset: assets/fonts/Raleway/static/Raleway-BoldItalic.ttf
          weight: 700
          style: italic

        - asset: assets/fonts/Raleway/static/Raleway-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Raleway/static/Raleway-ExtraBoldItalic.ttf
          weight: 800
          style: italic

        - asset: assets/fonts/Raleway/static/Raleway-Black.ttf
          weight: 900
        - asset: assets/fonts/Raleway/static/Raleway-BlackItalic.ttf
          weight: 900
          style: italic

    # ------------------------------------------------------------
    # Roboto
    # ------------------------------------------------------------
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/static/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto/static/Roboto-ThinItalic.ttf
          weight: 100
          style: italic

        - asset: assets/fonts/Roboto/static/Roboto-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Roboto/static/Roboto-ExtraLightItalic.ttf
          weight: 200
          style: italic

        - asset: assets/fonts/Roboto/static/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto/static/Roboto-LightItalic.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/Roboto/static/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto/static/Roboto-Italic.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/Roboto/static/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/static/Roboto-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/Roboto/static/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto/static/Roboto-SemiBoldItalic.ttf
          weight: 600
          style: italic

        - asset: assets/fonts/Roboto/static/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto/static/Roboto-BoldItalic.ttf
          weight: 700
          style: italic

        - asset: assets/fonts/Roboto/static/Roboto-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Roboto/static/Roboto-ExtraBoldItalic.ttf
          weight: 800
          style: italic

        - asset: assets/fonts/Roboto/static/Roboto-Black.ttf
          weight: 900
        - asset: assets/fonts/Roboto/static/Roboto-BlackItalic.ttf
          weight: 900
          style: italic

    # ------------------------------------------------------------
    # Ubuntu
    # ------------------------------------------------------------
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu/Ubuntu-Light.ttf
          weight: 300
        - asset: assets/fonts/Ubuntu/Ubuntu-LightItalic.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/Ubuntu/Ubuntu-Regular.ttf
          weight: 400
        - asset: assets/fonts/Ubuntu/Ubuntu-Italic.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/Ubuntu/Ubuntu-Medium.ttf
          weight: 500
        - asset: assets/fonts/Ubuntu/Ubuntu-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/Ubuntu/Ubuntu-Bold.ttf
          weight: 700
        - asset: assets/fonts/Ubuntu/Ubuntu-BoldItalic.ttf
          weight: 700
          style: italic

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
